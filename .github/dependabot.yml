version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    commit-message:
      prefix: ci(deps)
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      rust-dependencies:
        patterns: ["*"]
