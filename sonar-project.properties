sonar.projectKey=kadupulhq_rondi
sonar.organization=kadupulhq

# sonar.sources rejects globs and a missing directory, and main has no crates
# yet, so index from the root and narrow with inclusions.
sonar.sources=.
sonar.inclusions=crates/*/src/**
sonar.tests=.
sonar.test.inclusions=crates/*/tests/**
# Frozen vectors are deliberately malformed input bytes, not code.
sonar.test.exclusions=crates/*/tests/data/**

sonar.rust.clippyReport.reportPaths=clippy.json
sonar.rust.lcov.reportPaths=lcov.info
# Translation catalogs and LC_TIME tables are per-locale data with identical
# structure, so copy-paste detection reports every locale as a duplicate.
sonar.cpd.exclusions=crates/rondi-cli/src/i18n/catalogs/**,crates/rondi/src/locale/time_tables.rs
