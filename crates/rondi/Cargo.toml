[package]
name = "rondi"
description = "Pure Rust RRDtool library: create, update, fetch and graph .rrd round-robin databases, byte-compatible with RRDtool 1.11.0, with no C code"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/rondi"
readme = "README.md"
keywords = ["rrdtool", "rrd", "time-series", "round-robin", "monitoring"]
categories = ["database-implementations", "visualization"]
include = [
    "/src/**",
    "/README.md",
    "/COPYRIGHT",
    "/LICENSE-APACHE",
    "/LICENSE-GPL-2.0",
    "/LICENSE-MIT",
    "/THIRD-PARTY-NOTICES.md",
]

[lints]
workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
fs2.workspace = true
libc.workspace = true
rustix.workspace = true
roxmltree.workspace = true

[dev-dependencies]
tempfile = "3"

[[bench]]
name = "workload"
harness = false

[[bench]]
name = "rrd_workload"
harness = false

[[bench]]
name = "rrd_queries"
harness = false
