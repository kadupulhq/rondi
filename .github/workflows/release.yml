name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    uses: kadupulhq/.github/.github/workflows/release.yml@701fd2e1af15ff1dafa1d2225a33ad01e299d1ee # main
    with:
      generate-notes: true
    # Turning on tarball or image below also needs packages: write,
    # id-token: write and attestations: write here. A called workflow can only
    # narrow the caller's token, never widen it.
    permissions:
      contents: write
