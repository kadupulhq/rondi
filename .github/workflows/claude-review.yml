name: Claude review

# Reviews pull requests with anthropics/claude-code-action and answers @claude
# mentions from repository members. Every job skips with a warning until the
# ANTHROPIC_API_KEY Actions secret exists.
#
# Review an existing pull request by hand:
#   gh workflow run claude-review.yml -f pr_number=123

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: string

permissions:
  contents: read

jobs:
  config:
    name: Check review configuration
    # Fork and Dependabot pull requests get no secrets. Only members can start
    # a run from a comment, and only on pull requests.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
        !github.event.pull_request.draft &&
        github.actor != 'dependabot[bot]' &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ${{ vars.DO_RUNNERS_ENABLED == 'true' && (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","Linux","X64","kadupul-do"]') || 'ubuntu-latest' }}
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Validate pull request number
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          # grep matches line by line and would accept "1\n2"; [[ =~ ]] anchors the whole value.
          if [[ ! "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo '::error::pr_number must be digits only.'
            exit 1
          fi

      - name: Check whether ANTHROPIC_API_KEY is configured
        id: check
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo '::warning::Claude review is skipped. Configure the ANTHROPIC_API_KEY Actions secret to enable it.'
          fi

  review:
    name: Automatic review
    needs: config
    if: >-
      needs.config.outputs.configured == 'true' &&
      (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
    runs-on: ${{ vars.DO_RUNNERS_ENABLED == 'true' && (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","Linux","X64","kadupul-do"]') || 'ubuntu-latest' }}
    concurrency:
      group: claude-review-${{ github.event.pull_request.number || inputs.pr_number }}
      cancel-in-progress: true
    # The action posts through the job token, so these scopes bound what the
    # review can write: comments and reviews only, no pushes.
    permissions:
      contents: read
      pull-requests: write # inline review comments
      issues: write # pull request conversation comments go through the issues API
    steps:
      - name: Resolve pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          INPUT_PR: ${{ inputs.pr_number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = 'pull_request' ]; then
            echo "number=$EVENT_PR" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          state=$(gh pr view "$INPUT_PR" --repo "$REPO" --json state --jq .state)
          if [ "$state" != 'OPEN' ]; then
            echo "::error::Pull request #$INPUT_PR is $state, not OPEN."
            exit 1
          fi
          # A dispatched run holds the secret, so keep it away from fork code.
          cross=$(gh pr view "$INPUT_PR" --repo "$REPO" --json isCrossRepository --jq .isCrossRepository)
          if [ "$cross" != 'false' ]; then
            echo "::error::Pull request #$INPUT_PR comes from a fork; review it by hand."
            exit 1
          fi
          echo "number=$INPUT_PR" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Keep executable configuration on the trusted default branch.
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Review
        uses: anthropics/claude-code-action@12dd8d74c712f5f3669365b2369b558c495b1104 # v1.0.238
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ steps.pr.outputs.number }}

            Review the diff of this pull request (`gh pr diff`). Report only
            real problems:
            - correctness bugs and unhandled failure paths
            - security: authorization checks, injection (SQL, shell, path),
              and output encoding
            - changed behaviour that has no test
            ${{ github.event_name == 'workflow_dispatch' && 'Inline comments are not available on this run, so post all findings as one comment with `gh pr comment`, citing file and line for each.' || 'Post each finding as an inline review comment on the line it concerns. Post one short summary comment with `gh pr comment` only if there are findings that do not fit a line.' }}
            If there is nothing to report, say so in one comment.
          claude_args: >-
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

  respond:
    name: Answer @claude
    needs: config
    if: >-
      needs.config.outputs.configured == 'true' &&
      (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment')
    runs-on: ${{ vars.DO_RUNNERS_ENABLED == 'true' && (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","Linux","X64","kadupul-do"]') || 'ubuntu-latest' }}
    # contents: read keeps @claude to answering and reviewing; it cannot push.
    permissions:
      contents: read
      pull-requests: write # inline review comments
      issues: write # pull request conversation comments go through the issues API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Comment events must never load PR-authored executable configuration.
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Respond
        uses: anthropics/claude-code-action@12dd8d74c712f5f3669365b2369b558c495b1104 # v1.0.238
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
