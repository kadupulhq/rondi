name: Rust

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The compatibility suite shells out to rrdtool. Build its pinned 1.11.0
      # oracle and run every Rust check in that same environment so differential
      # tests cannot silently pass by skipping when rrdtool is absent.
      - name: Build pinned RRDtool oracle and run workspace checks
        run: docker build --progress=plain -f docker/Dockerfile.test -t rondi-ci .

  ci-arm64:
    # The default NaN sign bit differs between x86_64 and aarch64, and RRDtool
    # prints it as glibc formats it, so run the same oracle suite on both.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build pinned RRDtool oracle and run workspace checks
        run: docker build --progress=plain -f docker/Dockerfile.test -t rondi-ci .
