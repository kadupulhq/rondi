name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Rulesets change even when the code does not. Catch that weekly.
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep
    runs-on: ${{ vars.DO_RUNNERS_ENABLED == 'true' && (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","Linux","X64","kadupul-do"]') || 'ubuntu-latest' }}
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Blocking. The tree starts clean, so the bar is zero findings and stays
      # there. A rule that fires wrongly gets a nosem comment with a reason, not
      # a relaxed gate.
      - name: Scan
        env:
          IMAGE: semgrep/semgrep@sha256:12672acdb0949e19f9f6a4c2b288edd0b404f268f0ca7738a2c06f372f50362e
        run: |
          set -euo pipefail
          configs=(--config p/security-audit --config p/secrets)
          # Add the language pack for this repository, for example --config p/php.
          # Project-specific taint rules, once the fork carries them.
          [ -f .semgrep.yml ] && configs+=(--config .semgrep.yml)
          [ -d tests/security/semgrep ] && configs+=(--config tests/security/semgrep)

          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --volume "${PWD}:/src" \
            --workdir /src \
            "$IMAGE" \
            semgrep scan "${configs[@]}" \
              --error \
              --metrics off \
              --timeout 0 --timeout-threshold 0 --max-target-bytes 0 \
              --sarif --output semgrep.sarif

      # Code scanning needs the paid Code Security add-on on a private
      # repository, so this only runs once the repository is public. The scan
      # above is the gate either way.
      - name: Upload to code scanning
        if: ${{ always() && !github.event.repository.private && hashFiles('semgrep.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Keep the report when the scan fails
        if: ${{ failure() && hashFiles('semgrep.sarif') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          retention-days: 14

  dependencies:
    name: Dependency review
    # Needs the dependency graph, which is another Code Security feature on a
    # private repository. Turns itself on with the repository.
    if: ${{ github.event_name == 'pull_request' && !github.event.repository.private }}
    runs-on: ${{ vars.DO_RUNNERS_ENABLED == 'true' && (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","Linux","X64","kadupul-do"]') || 'ubuntu-latest' }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
          # A dependency that is not redistributable under GPL-3.0 cannot ship.
          deny-licenses: AGPL-1.0-or-later, AGPL-3.0-or-later, SSPL-1.0, BUSL-1.1, Elastic-2.0

  rust-dependencies:
    name: Rust dependency audit and policy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install RustSec tools
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo install cargo-deny --version 0.20.2 --locked
      - name: Check known Rust advisories
        run: cargo audit --deny warnings
      - name: Check dependency licenses, advisories, duplicates, and sources
        run: cargo deny check
