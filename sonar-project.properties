sonar.projectKey=kadupulhq_rondi
sonar.organization=kadupulhq

# sonar.sources rejects globs and a missing directory, and main has no crates
# yet, so index from the root and narrow with inclusions.
sonar.sources=.
sonar.inclusions=crates/*/src/**
sonar.tests=.
sonar.test.inclusions=crates/*/tests/**

sonar.rust.clippyReport.reportPaths=clippy.json
sonar.rust.lcov.reportPaths=lcov.info
