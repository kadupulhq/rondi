[package]
name = "rondi-server"
description = "Pure Rust rrdcached-compatible daemon for RRDtool .rrd files, with write journaling and storage coordination"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/rondi-server"
readme = "README.md"
keywords = ["rrdtool", "rrdcached", "rrd", "time-series", "monitoring"]
categories = ["database-implementations", "network-programming"]
include = [
    "/src/**",
    "/README.md",
    "/COPYRIGHT",
    "/LICENSE-APACHE",
    "/LICENSE-GPL-2.0",
    "/LICENSE-MIT",
]

[lints]
workspace = true

[dependencies]
rondi.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
bytes.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
libc.workspace = true
rustix.workspace = true

[dev-dependencies]
tempfile = "3"
