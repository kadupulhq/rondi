name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    uses: kadupulhq/.github/.github/workflows/release.yml@7455e0f5836d3a220bf94ace2baa59968efe4545 # main
    with:
      generate-notes: true
    # Turning on tarball or image below also needs packages: write,
    # id-token: write and attestations: write here. A called workflow can only
    # narrow the caller's token, never widen it.
    permissions:
      contents: write
